<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Career</title>
<style>
  :root {
    --header-bg: #a7c3e0;
    --border: #a2a9b1;
    --link: #3366cc;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #202122;
    --correct: #1a7a3c;
    --wrong: #b3261e;
    --timer: #3366cc;
    --track: #e1e4e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 1180px; }

  .layout { display: flex; flex-direction: column; gap: 20px; }
  .sidebar { display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 13px; font-weight: 600; color: #444; }
  .league-boxes {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    max-height: 400px; overflow-y: auto; padding-right: 4px; margin-right: -4px;
  }
  .league-boxes::-webkit-scrollbar { width: 6px; }
  .league-boxes::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  .league-boxes::-webkit-scrollbar-track { background: transparent; }
  .league-box {
    padding: 10px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; font-size: 13px; line-height: 1.3; cursor: pointer; user-select: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .league-box:hover { border-color: var(--link); }
  .league-box.active { background: var(--link); border-color: var(--link); color: #fff; font-weight: 600; }
  .league-box.disabled { opacity: 0.45; cursor: default; position: relative; }
  .league-box.disabled:hover { border-color: var(--border); }
  .league-name { font-weight: 500; }
  .league-progress {
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em; color: #888;
  }
  .league-box.active .league-progress { color: rgba(255,255,255,0.85); }
  .reset-btn {
    align-self: flex-start; background: none; border: 1px solid var(--border); color: #555;
    padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .reset-btn:hover { background: #eee; }
  .main { flex: 1; min-width: 0; max-width: 460px; }

  .leaderboard-panel { display: flex; flex-direction: column; gap: 10px; }
  .lb-title { font-size: 15px; font-weight: 700; }
  .lb-controls { display: flex; flex-direction: column; gap: 6px; }
  .lb-select {
    padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: #fff; color: var(--text);
  }
  .lb-select:disabled { color: #999; background: #f2f2f2; }
  .lb-list { display: flex; flex-direction: column; gap: 4px; }
  .lb-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 6px; font-size: 13px; background: #fff; border: 1px solid #eee;
  }
  .lb-rank { width: 18px; text-align: center; font-weight: 700; color: #999; flex-shrink: 0; }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-weight: 600; color: #555; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lb-row.lb-you { background: #eef3ff; border-color: var(--link); }
  .lb-row.lb-you .lb-name, .lb-row.lb-you .lb-score { color: var(--link); font-weight: 700; }
  .lb-divider { text-align: center; color: #aaa; font-size: 12px; margin: 2px 0; }

  @media (min-width: 980px) {
    .layout { flex-direction: row; align-items: flex-start; }
    .sidebar { width: 340px; flex-shrink: 0; }
    .leaderboard-panel { width: 280px; flex-shrink: 0; }
  }

  .progress-block { margin-bottom: 16px; }
  .progress-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; color: #555; margin-bottom: 3px;
  }
  .progress-row strong { color: var(--text); font-size: 14px; }
  .progress-track {
    height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-bottom: 10px;
  }
  .progress-fill {
    height: 100%; background: var(--correct); width: 0%; transition: width 0.4s ease;
  }

  .scorebar {
    display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: #666;
  }

  .timer-track { height: 6px; background: var(--track); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .timer-fill { height: 100%; background: var(--timer); width: 100%; transition: width 0.1s linear, background-color 0.3s; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .card-header { background: var(--header-bg); text-align: center; font-weight: 700; font-size: 17px; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 8px 10px; text-align: left; }
  thead th { font-weight: 700; border-bottom: 1px solid #ccc; font-size: 14px; }
  th.apps, td.apps { text-align: right; }
  th.apps u { text-decoration-style: dotted; }
  tbody tr:not(:last-child) td { border-bottom: 1px solid #eee; }
  td.team { color: var(--link); font-weight: 500; }

  .feedback { min-height: 26px; text-align: center; font-weight: 600; margin-top: 12px; font-size: 15px; }
  .feedback.correct { color: var(--correct); }
  .feedback.wrong { color: var(--wrong); }

  form { display: flex; gap: 8px; margin-top: 10px; }
  input[type="text"] { flex: 1; padding: 10px 12px; font-size: 16px; border: 1px solid var(--border); border-radius: 4px; outline: none; }
  input[type="text"]:focus { border-color: var(--link); }
  button { padding: 10px 18px; font-size: 15px; font-weight: 600; background: var(--link); color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }

  .hint { text-align: center; color: #888; font-size: 12px; margin-top: 10px; }
  .done-banner { text-align: center; padding: 40px 20px; }
  .done-banner h2 { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
<div class="layout">

  <div class="sidebar">
    <div class="sidebar-title">Let's focus on players from...</div>
    <div class="league-boxes" id="leagueBoxes"></div>
    <button type="button" class="reset-btn" id="resetFilterBtn">Reset (show all)</button>
  </div>

  <div class="main">

  <div class="scorebar">
    <div>Current streak: <strong id="streak">0</strong></div>
  </div>

  <div id="gameArea">
    <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>

    <div class="card">
      <div class="card-header">Senior career*</div>
      <table>
        <thead><tr><th>Years</th><th>Team</th><th class="apps"><u>Apps (Gls)</u></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="feedback" id="feedback"></div>

    <form id="guessForm" autocomplete="off">
      <input type="text" id="guessInput" placeholder="Who is this player?" />
      <button type="submit">Guess</button>
    </form>
    <div class="hint">Guess before the bar runs out · press Enter to submit</div>
  </div>

  <div class="done-banner" id="doneBanner" style="display:none;">
    <h2>All done! 🎉</h2>
    <p>You've identified every player in the current selection.</p>
  </div>

  </div>

  <div class="leaderboard-panel">
    <div class="lb-title">Leaderboard</div>
    <div class="lb-controls">
      <select id="lbLeagueSelect" class="lb-select"></select>
      <select id="lbTeamSelect" class="lb-select"></select>
    </div>
    <div class="lb-list" id="lbList"></div>
    <div id="lbYou"></div>
  </div>

</div>
</div>

<script>
// ---- DATA -----------------------------------------------------------
// Structure: one club object per club. Add more clubs here to expand the league.
const LEAGUE_NAME = "Premier League";

const CLUBS = [

      { id: "andreysantos", names: ["andrey santos","santos"], display: "Andrey Santos",
        rows: [["2021–2023","Vasco da Gama",40,3],["2023–","Chelsea",30,2]] },
      { id: "essugo", names: ["dario essugo","essugo","dário essugo"], display: "Dário Essugo",

      { id: "palmer", names: ["cole palmer","palmer"], display: "Cole Palmer",

        rows: [["2017–2019","Valencia",70,20],["2019–2021","Valencia",70,20],["2021–2024","Wolves",92,40],["2024–","Chelsea",40,10]] },
      { id: "joaopedro", names: ["joao pedro","joão pedro"], display: "João Pedro",
        rows: [["2020–2023","Watford",130,50],["2023–2025","Brighton",60,25],["2025–","Chelsea",20,15]] },
      { id: "delap", names: ["liam delap","delap"], display: "Liam Delap",
        rows: [["2022–2025","Ipswich Town",60,20],["2025–","Chelsea",30,10]] },
      { id: "estevao", names: ["estevao","estêvão"], display: "Estêvão",
        rows: [["2022–2025","Palmeiras",90,20],["2025–","Chelsea",15,3]] },
      { id: "nkunku", names: ["christopher nkunku","nkunku"], display: "Christopher Nkunku",
        rows: [["2019–2023","RB Leipzig",121,58],["2023–","Chelsea",60,15]] },
      { id: "guiu", names: ["marc guiu","guiu"], display: "Marc Guiu",
        rows: [["2023–2024","Barcelona",5,2],["2024–","Chelsea",20,5]] }
    ]
  },
  // Add more club objects here to expand the league further
];

// League groupings — used to power the left-hand filter boxes.
// `active: true` means real player data exists for that league.
// The rest are placeholders until their clubs/players get added to CLUBS.
const LEAGUES = [
  { id: "epl", name: "Premier League", active: true },
  { id: "laliga", name: "La Liga", active: true },
  { id: "seriea", name: "Serie A", active: false },
  { id: "bundesliga", name: "Bundesliga", active: true },
  { id: "ligue1", name: "Ligue 1", active: false },
  { id: "eredivisie", name: "Eredivisie", active: false },
  { id: "primeira", name: "Primeira Liga", active: false },
  { id: "scottish", name: "Scottish Premiership", active: false },
  { id: "belgian", name: "Belgian Pro League", active: false },
  { id: "superlig", name: "Süper Lig", active: false },
  { id: "brasileirao", name: "Brasileirão", active: false },
  { id: "ligamx", name: "Liga MX", active: false },
  { id: "mls", name: "MLS", active: false },
  { id: "argentina", name: "Argentine Primera División", active: false },
  { id: "saudi", name: "Saudi Pro League", active: false },
  { id: "j1league", name: "J1 League", active: false },
  { id: "kleague", name: "K League 1", active: false },
  { id: "aleague", name: "A-League", active: false },
  { id: "championship", name: "Championship", active: false },
  { id: "rpl", name: "Russian Premier League", active: false }
];
CLUBS.forEach(c => { if (!c.leagueId) c.leagueId = "epl"; });

// ---- STATE ------------------------------------------------------------
let completed = new Set();
let allPlayers = []; // flattened {clubId, clubName, leagueId, ...player}
let selectedLeagues = new Set(); // empty = no filter, all leagues eligible
let pool = [];
let current = null;
let timer = null;
let streak = 0;
let locked = false;
let isSignedIn = false; // reserved for future real auth

const rowsEl = document.getElementById('rows');
const feedbackEl = document.getElementById('feedback');
const streakEl = document.getElementById('streak');
const timerFill = document.getElementById('timerFill');
const guessForm = document.getElementById('guessForm');
const guessInput = document.getElementById('guessInput');
const gameArea = document.getElementById('gameArea');
const doneBanner = document.getElementById('doneBanner');
const leagueBoxesEl = document.getElementById('leagueBoxes');
const lbLeagueSelect = document.getElementById('lbLeagueSelect');
const lbTeamSelect = document.getElementById('lbTeamSelect');
const lbListEl = document.getElementById('lbList');
const lbYouEl = document.getElementById('lbYou');
const resetFilterBtn = document.getElementById('resetFilterBtn');

function flatten() {
  allPlayers = [];
  CLUBS.forEach(club => {
    club.players.forEach(p => {
      allPlayers.push({ ...p, clubId: club.id, clubName: club.name, leagueId: club.leagueId });
    });
  });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function loadCompleted() {
  if (!isSignedIn) { completed = new Set(); return; } // guests start fresh, nothing to load
  try {
    const res = await window.storage.get('guess-career-completed', false);
    const arr = res ? JSON.parse(res.value) : [];
    completed = new Set(arr);
  } catch (e) {
    completed = new Set();
  }
}

async function saveCompleted() {
  if (!isSignedIn) return; // guest progress is session-only, never persisted
  try {
    await window.storage.set('guess-career-completed', JSON.stringify([...completed]), false);
  } catch (e) {}
}

function updateProgressUI() {
  renderLeagueBoxes();
}

function renderPlayer(player) {
  rowsEl.innerHTML = player.rows.map(r => `
    <tr><td>${r[0]}</td><td class="team">${r[1]}</td><td class="apps">${r[2]} (${r[3]})</td></tr>
  `).join('');
}

function eligiblePlayers() {
  return allPlayers.filter(p =>
    !completed.has(p.id) &&
    (selectedLeagues.size === 0 || selectedLeagues.has(p.leagueId))
  );
}

function buildPool() {
  pool = shuffle(eligiblePlayers());
}

function applyFilterChange() {
  clearInterval(timer);
  buildPool();
  startRound();
}

function renderLeagueBoxes() {
  leagueBoxesEl.innerHTML = LEAGUES.map(l => {
    let progressText;
    if (l.active) {
      const leaguePlayers = allPlayers.filter(p => p.leagueId === l.id);
      const done = leaguePlayers.filter(p => completed.has(p.id)).length;
      progressText = `${done} / ${leaguePlayers.length}`;
    } else {
      progressText = '0 / 109'; // mock placeholder until this league's real data is added
    }
    return `
    <div class="league-box${selectedLeagues.has(l.id) ? ' active' : ''}${l.active ? '' : ' disabled'}" data-league="${l.id}" data-active="${l.active}">
      <span class="league-name">${l.name}</span>
      <span class="league-progress">${progressText}</span>
    </div>
  `;
  }).join('');
}

leagueBoxesEl.addEventListener('click', (e) => {
  const box = e.target.closest('.league-box');
  if (!box) return;
  if (box.dataset.active !== 'true') return; // mock leagues aren't selectable yet
  const id = box.dataset.league;
  if (selectedLeagues.has(id)) selectedLeagues.delete(id);
  else selectedLeagues.add(id);
  renderLeagueBoxes();
  applyFilterChange();
});

resetFilterBtn.addEventListener('click', () => {
  selectedLeagues.clear();
  renderLeagueBoxes();
  applyFilterChange();
});

// ---- MOCK LEADERBOARD ---------------------------------------------------
// All numbers here are placeholders until real accounts/scores exist.
const LB_WORLDWIDE_TOTAL = 93881;
const LB_LEAGUE_TOTALS = {
  epl: 4200, laliga: 3900, seriea: 3800, bundesliga: 3400, ligue1: 3200,
  eredivisie: 1800, primeira: 1600, scottish: 1100, belgian: 1200, superlig: 1500,
  brasileirao: 3000, ligamx: 1900, mls: 2100, argentina: 2400, saudi: 1100,
  j1league: 1600, kleague: 1000, aleague: 700, championship: 3100, rpl: 1300
};
const LB_CLUB_TOTALS = {
  arsenal: 1200, mancity: 1100, spurs: 950, chelsea: 1050, liverpool: 1150,
  barcelona: 1300, bayern: 1250
};
const LB_MOCK_NAMES = [
  "alex","jamie","sofia","liam","noah","emma","oliver","ava","lucas","mia",
  "ethan","isla","mateo","zoe","leo","nora","kai","ruby","finn","luna",
  "priya","hugo","mila","theo","ines","axel","freja","omar","sara","yusuf"
];

function seededRandom(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) { h = (Math.imul(31, h) + seedStr.charCodeAt(i)) | 0; }
  return function () {
    h = Math.imul(h ^ (h >>> 15), 1 | h);
    h ^= h + Math.imul(h ^ (h >>> 7), 61 | h);
    return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
  };
}

function lbTotalForScope(leagueId, teamId) {
  if (leagueId === 'worldwide') return LB_WORLDWIDE_TOTAL;
  if (!teamId || teamId === 'all') return LB_LEAGUE_TOTALS[leagueId] || 1000;
  return LB_CLUB_TOTALS[teamId] || 300;
}

function generateLeaderboard(leagueId, teamId) {
  const scopeKey = `${leagueId}:${teamId || 'all'}`;
  const total = lbTotalForScope(leagueId, teamId);
  const rand = seededRandom(scopeKey);
  const scaleFactor = Math.max(0.3, Math.min(1, total / 4000));

  const entries = LB_MOCK_NAMES.map(name => {
    const engagement = 150 + rand() * 2500;
    return { name, score: Math.min(total, Math.round(engagement * scaleFactor)) };
  });

  const davidRaw = (leagueId === 'worldwide')
    ? 353
    : Math.max(5, Math.round(353 * (total / LB_WORLDWIDE_TOTAL)));
  entries.push({ name: 'david', score: Math.min(total, davidRaw) });

  entries.sort((a, b) => b.score - a.score);
  const rank = entries.findIndex(e => e.name === 'david') + 1;
  return { total, entries, rank };
}

function populateLeagueSelect() {
  const options = ['<option value="worldwide">Worldwide</option>']
    .concat(LEAGUES.map(l => `<option value="${l.id}">${l.name}</option>`));
  lbLeagueSelect.innerHTML = options.join('');
}

function populateTeamSelect() {
  const leagueId = lbLeagueSelect.value;
  if (leagueId === 'worldwide') {
    lbTeamSelect.innerHTML = '<option value="all">All teams</option>';
    lbTeamSelect.disabled = true;
    return;
  }
  const clubs = CLUBS.filter(c => c.leagueId === leagueId);
  if (clubs.length === 0) {
    lbTeamSelect.innerHTML = '<option value="all">All teams</option>';
    lbTeamSelect.disabled = true;
    return;
  }
  lbTeamSelect.disabled = false;
  lbTeamSelect.innerHTML = '<option value="all">All teams</option>' +
    clubs.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

function renderLeaderboard() {
  const leagueId = lbLeagueSelect.value;
  const teamId = lbTeamSelect.value;
  const { total, entries, rank } = generateLeaderboard(leagueId, teamId);
  const top = entries.slice(0, 8);

  lbListEl.innerHTML = top.map((e, i) => `
    <div class="lb-row${e.name === 'david' ? ' lb-you' : ''}">
      <span class="lb-rank">${i + 1}</span>
      <span class="lb-name">${e.name}${e.name === 'david' ? ' (you)' : ''}</span>
      <span class="lb-score">${e.score} / ${total}</span>
    </div>
  `).join('');

  const davidInTop = top.some(e => e.name === 'david');
  if (!davidInTop) {
    const davidEntry = entries.find(e => e.name === 'david');
    lbYouEl.innerHTML = `
      <div class="lb-divider">···</div>
      <div class="lb-row lb-you">
        <span class="lb-rank">${rank}</span>
        <span class="lb-name">david (you)</span>
        <span class="lb-score">${davidEntry.score} / ${total}</span>
      </div>
    `;
  } else {
    lbYouEl.innerHTML = '';
  }
}

lbLeagueSelect.addEventListener('change', () => {
  populateTeamSelect();
  renderLeaderboard();
});
lbTeamSelect.addEventListener('change', renderLeaderboard);

function startRound() {
  if (pool.length === 0) buildPool();
  if (pool.length === 0) {
    gameArea.style.display = 'none';
    doneBanner.style.display = 'block';
    return;
  }
  gameArea.style.display = 'block';
  doneBanner.style.display = 'none';

  locked = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  guessInput.value = '';
  guessInput.disabled = false;
  guessInput.focus();

  current = pool.pop();
  renderPlayer(current);
  updateProgressUI();

  timerFill.style.width = '100%';
  timerFill.style.background = 'var(--timer)';
  clearInterval(timer);
  const start = Date.now();
  timer = setInterval(() => {
    const elapsed = (Date.now() - start) / 1000;
    const pct = Math.max(0, 100 - (elapsed / 15) * 100);
    timerFill.style.width = pct + '%';
    if (pct < 30) timerFill.style.background = 'var(--wrong)';
    if (elapsed >= 15) { clearInterval(timer); timeUp(); }
  }, 60);
}

async function endRound(isCorrect) {
  clearInterval(timer);
  locked = true;
  guessInput.disabled = true;
  if (isCorrect) {
    streak++;
    streakEl.textContent = streak;
    completed.add(current.id);
    await saveCompleted();
    feedbackEl.textContent = `Correct! It's ${current.display}`;
    feedbackEl.className = 'feedback correct';
    updateProgressUI();
  } else {
    streak = 0;
    streakEl.textContent = streak;
    feedbackEl.textContent = `Incorrect!`;
    feedbackEl.className = 'feedback wrong';
    // not completed — put it back into the pool for a later round
    pool.unshift(current);
  }
  setTimeout(startRound, 1600);
}

function timeUp() { if (!locked) endRound(false); }

function normalize(s) {
  return s.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

guessForm.addEventListener('submit', (e) => {
  e.preventDefault();
  if (locked) return;
  const guess = normalize(guessInput.value);
  const isCorrect = guess !== '' && current.names.some(n => normalize(n) === guess);
  endRound(isCorrect);
});

(async function init() {
  flatten();
  renderLeagueBoxes();
  populateLeagueSelect();
  populateTeamSelect();
  renderLeaderboard();
  await loadCompleted();
  buildPool();
  startRound();
})();
</script>
</body>
</html>
